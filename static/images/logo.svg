<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="thGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Badge -->
  <rect x="6" y="6" width="48" height="48" rx="14" fill="#0f172a" stroke="url(#thGrad)" stroke-width="2.5" />
  
  <!-- Interconnecting Node Lines -->
  <circle cx="20" cy="18" r="2.5" fill="#10b981" />
  <circle cx="40" cy="18" r="2.5" fill="#06b6d4" />
  <circle cx="30" cy="42" r="2.5" fill="#34d399" />
  <line x1="20" y1="18" x2="30" y2="42" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="2 2" />
  <line x1="40" y1="18" x2="30" y2="42" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="2 2" />

  <!-- Modern 'T' Monogram -->
  <path d="M19 22H41V27H33V42H27V27H19V22Z" fill="url(#accentGlow)" />

  <!-- Typography: TrustHub -->
  <text x="66" y="34" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="900" font-size="23" fill="#ffffff" letter-spacing="-0.5">Trust<tspan fill="url(#thGrad)">Hub</tspan></text>
  
  <!-- Sub-label: NETWORKING -->
  <text x="67" y="47" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="800" font-size="9.5" fill="#10b981" letter-spacing="2.8">NETWORKING</text>
</svg>
